allowBuilds:
  esbuild: true
  simple-git-hooks: true
  workerd: true
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - "@concertypin/*"
# Preserve the publishing trust level across releases.
trustPolicy: no-downgrade
trustPolicyExclude:
  - "semver@6.3.1"
  # Signed upstream release used by the MCP Inspector E2E dependency tree.
  - "chokidar@4.0.3"
